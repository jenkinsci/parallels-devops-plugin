# Continuous Delivery - releases to Jenkins Update Center
# Trigger manually after merging a release PR
# The publish-release workflow will automatically upload the HPI after CD completes
name: cd

on:
  workflow_dispatch:

jobs:
  maven-cd:
    uses: jenkins-infra/github-reusable-workflows/.github/workflows/maven-cd.yml@v1
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
